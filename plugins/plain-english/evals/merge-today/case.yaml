schema_version: "1.1"
name: merge-today
description: >
  Asking whether a PR can merge, where its macOS job fails because a new test compares a path under /var with its resolved form under /private/var.
expected_outcome: >
  The reply says no, names the failing test and its cause, and says what fixes it, without stand-ins.
tags: [writing, stand-ins]
context:
  scaffold_script: setup.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Grep, Glob]
  append_system_prompt: This folder is not a git repository, and git and gh can't run in this environment. The files in it describe the project's release, tasks and pull requests.
  prompt: "Can we merge #33 today?"
